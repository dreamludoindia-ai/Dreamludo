<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DreamLudo - Play</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            width: 100%;
            max-width: 1400px;
            height: 95vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.4);
        }

        .logo h2 {
            background: linear-gradient(135deg, #4a6cf7 0%, #7b4ad7 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-size: 24px;
            font-weight: 800;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #f8f9fc;
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid #e2e6ed;
        }

        .player-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #4a6cf7 0%, #7b4ad7 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .player-details {
            text-align: right;
        }

        .player-name {
            font-weight: 700;
            color: #333;
        }

        .player-city {
            font-size: 12px;
            color: #666;
        }

        .logout-btn {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 50px;
            padding: 8px 20px;
            color: #d32f2f;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .logout-btn:hover {
            background: #fdd;
            transform: translateY(-2px);
        }

        .game-layout {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            flex: 1;
            min-height: 0;
        }

        .game-board {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.5);
            position: relative;
        }

        canvas {
            border-radius: 16px;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            background: #f5e6d3;
        }

        .game-sidebar {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        .dice-area {
            margin-bottom: 25px;
        }

        .dice-display {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #4a6cf7 0%, #7b4ad7 100%);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            font-weight: bold;
            color: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(74, 108, 247, 0.4);
        }

        .roll-btn {
            background: linear-gradient(135deg, #4a6cf7 0%, #7b4ad7 100%);
            border: none;
            border-radius: 60px;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.3);
        }

        .roll-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 108, 247, 0.4);
        }

        .roll-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .turn-indicator {
            margin-top: 20px;
            padding: 12px;
            font-weight: bold;
            border-radius: 60px;
            background: #f0f2f5;
            border: 1px solid #e2e6ed;
        }

        .turn-red {
            color: #d32f2f;
        }

        .turn-green {
            color: #2e7d32;
        }

        .piece-selector {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .piece-btn {
            flex: 1;
            padding: 10px;
            background: #f0f2f5;
            border: 2px solid #e2e6ed;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .piece-btn:hover:not(:disabled) {
            background: #4a6cf7;
            color: white;
            border-color: #4a6cf7;
        }

        .piece-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .piece-btn.active-piece {
            background: #4a6cf7;
            color: white;
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74,108,247,0.3);
        }

        .stats-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        .stats-panel h3 {
            background: linear-gradient(135deg, #4a6cf7 0%, #7b4ad7 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 700;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2e6ed;
            color: #333;
            font-weight: 500;
        }

        .message-area {
            margin-top: 20px;
            padding: 12px;
            background: #f0f2f5;
            border-radius: 16px;
            color: #333;
            font-size: 14px;
            text-align: center;
            border: 1px solid #e2e6ed;
        }

        @media (max-width: 900px) {
            .dashboard {
                height: 100vh;
                padding: 15px;
            }
            .game-layout {
                overflow-y: auto;
            }
            canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <div class="logo">
                <h2>🎲 DreamLudo</h2>
            </div>
            <div class="player-info">
                <div class="player-avatar" id="avatarIcon">🎮</div>
                <div class="player-details">
                    <div class="player-name" id="playerNameDisplay">Player</div>
                    <div class="player-city" id="playerCityDisplay">City</div>
                </div>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <div class="game-layout">
            <div class="game-board">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
            </div>

            <div class="game-sidebar">
                <div class="control-panel">
                    <div class="dice-area">
                        <div class="dice-display" id="diceValue">1</div>
                        <button class="roll-btn" id="rollBtn">🎲 ROLL DICE</button>
                    </div>
                    
                    <div class="piece-selector" id="pieceSelector">
                        <button class="piece-btn" data-piece="0">Piece 1</button>
                        <button class="piece-btn" data-piece="1">Piece 2</button>
                        <button class="piece-btn" data-piece="2">Piece 3</button>
                        <button class="piece-btn" data-piece="3">Piece 4</button>
                    </div>
                    
                    <div class="turn-indicator" id="turnIndicator">🔴 Red's Turn</div>
                    <div class="message-area" id="messageArea">
                        Click Roll Dice, then select a piece to move!
                    </div>
                </div>

                <div class="stats-panel">
                    <h3>📊 Game Stats</h3>
                    <div class="stat-item">
                        <span>🔴 Red Pieces:</span>
                        <span id="redCount">0/4 at goal</span>
                    </div>
                    <div class="stat-item">
                        <span>🟢 Green Pieces:</span>
                        <span id="greenCount">0/4 at goal</span>
                    </div>
                    <div class="stat-item">
                        <span>🎲 Last Roll:</span>
                        <span id="lastRoll">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get user data
        const userData = JSON.parse(sessionStorage.getItem('dreamUser'));
        
        if(userData) {
            document.getElementById('playerNameDisplay').innerText = userData.name || 'Player';
            document.getElementById('playerCityDisplay').innerText = userData.city || 'City';
            const firstLetter = (userData.name || 'P').charAt(0).toUpperCase();
            document.getElementById('avatarIcon').innerHTML = firstLetter;
        }
        
        // --- Game State ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const rollBtn = document.getElementById('rollBtn');
        const messageArea = document.getElementById('messageArea');
        const turnIndicator = document.getElementById('turnIndicator');
        const diceValueDisplay = document.getElementById('diceValue');
        const lastRollSpan = document.getElementById('lastRoll');
        
        let diceValue = 1;
        let currentPlayer = 'red';
        let rolling = false;
        let waitingForPieceSelection = false;
        let lastRollValue = 0;
        
        // Piece positions: -1=home, 0-51=path, 52=goal
        let redPieces = [-1, -1, -1, -1];
        let greenPieces = [-1, -1, -1, -1];
        
        // Visual positions
        let redPositions = [
            { x: 80, y: 440 }, { x: 120, y: 440 },
            { x: 160, y: 440 }, { x: 200, y: 440 }
        ];
        
        let greenPositions = [
            { x: 80, y: 530 }, { x: 120, y: 530 },
            { x: 160, y: 530 }, { x: 200, y: 530 }
        ];
        
        let redGoalPositions = [
            { x: 470, y: 440 }, { x: 500, y: 440 },
            { x: 470, y: 470 }, { x: 500, y: 470 }
        ];
        
        let greenGoalPositions = [
            { x: 520, y: 440 }, { x: 550, y: 440 },
            { x: 520, y: 470 }, { x: 550, y: 470 }
        ];
        
        // Path positions
        let pathPositions = [];
        for(let i = 0; i < 52; i++) {
            let row = Math.floor(i / 13);
            let col = i % 13;
            pathPositions.push({
                x: 50 + col * 38 + 15,
                y: 50 + row * 38 + 15
            });
        }
        
        // Load board image
        const boardImage = new Image();
        boardImage.crossOrigin = "Anonymous";
        boardImage.src = "https://i.imgur.com/2rCkSof.jpeg";
        function drawGame() {
            ctx.clearRect(0, 0, 600, 600);
            
            if (boardImage.complete && boardImage.naturalHeight !== 0) {
                ctx.drawImage(boardImage, 0, 0, 600, 600);
            } else {
                ctx.fillStyle = '#f5e6d3';
                ctx.fillRect(0, 0, 600, 600);
                ctx.fillStyle = '#999';
                ctx.font = '16px Arial';
                ctx.fillText("Loading board...", 250, 300);
            }
            
            drawAllPieces();
            drawDice();
        }
        
        function drawAllPieces() {
            for(let i = 0; i < redPieces.length; i++) {
                let pos = redPieces[i];
                let x, y;
                if(pos === -1) { x = redPositions[i].x; y = redPositions[i].y; }
                else if(pos === 52) { x = redGoalPositions[i].x; y = redGoalPositions[i].y; }
                else { x = pathPositions[pos].x; y = pathPositions[pos].y; }
                drawPiece(x, y, 'red', i+1);
            }
            
            for(let i = 0; i < greenPieces.length; i++) {
                let pos = greenPieces[i];
                let x, y;
                if(pos === -1) { x = greenPositions[i].x; y = greenPositions[i].y; }
                else if(pos === 52) { x = greenGoalPositions[i].x; y = greenGoalPositions[i].y; }
                else { x = pathPositions[pos].x; y = pathPositions[pos].y; }
                drawPiece(x, y, 'green', i+1);
            }
        }
        
        function drawPiece(x, y, color, number) {
            ctx.shadowBlur = 4;
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.arc(x, y, 14, 0, Math.PI*2);
            const gradient = ctx.createLinearGradient(x-5, y-5, x+5, y+5);
            if(color === 'red') {
                gradient.addColorStop(0, '#ff5252');
                gradient.addColorStop(1, '#d32f2f');
            } else {
                gradient.addColorStop(0, '#66bb6a');
                gradient.addColorStop(1, '#2e7d32');
            }
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px "Segoe UI"';
            ctx.shadowBlur = 0;
            ctx.fillText(number, x-6, y+6);
        }
        
        function drawDice() {
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 0;
            ctx.fillRect(480, 50, 70, 70);
            ctx.strokeStyle = '#4a6cf7';
            ctx.lineWidth = 3;
            ctx.strokeRect(480, 50, 70, 70);
            ctx.fillStyle = '#4a6cf7';
            ctx.font = 'bold 36px "Segoe UI"';
            ctx.fillText(diceValue, 507, 98);
        }
        
        function updateUI() {
            const redGoalCount = redPieces.filter(p => p === 52).length;
            const greenGoalCount = greenPieces.filter(p => p === 52).length;
            document.getElementById('redCount').innerText = `${redGoalCount}/4 at goal`;
            document.getElementById('greenCount').innerText = `${greenGoalCount}/4 at goal`;
            
            if(currentPlayer === 'red') {
                turnIndicator.innerHTML = '🔴 Red\'s Turn';
                turnIndicator.className = 'turn-indicator turn-red';
            } else {
                turnIndicator.innerHTML = '🟢 Green\'s Turn';
                turnIndicator.className = 'turn-indicator turn-green';
            }
        }
        
        function getMovablePieces() {
            const pieces = (currentPlayer === 'red') ? redPieces : greenPieces;
            const movable = [];
            for(let i = 0; i < pieces.length; i++) {
                if(pieces[i] === -1 && diceValue === 6) {
                    movable.push(i);
                } else if(pieces[i] !== -1 && pieces[i] !== 52) {
                    if(pieces[i] + diceValue <= 52) {
                        movable.push(i);
                    }
                }
            }
            return movable;
        }
        
        function movePiece(pieceIndex) {
            if(!waitingForPieceSelection) {
                messageArea.innerText = "Please roll the dice first!";
                return;
            }
            
            const pieces = (currentPlayer === 'red') ? redPieces : greenPieces;
            const piecePos = pieces[pieceIndex];
            let moved = false;
            
            if(piecePos === -1 && diceValue === 6) {
                pieces[pieceIndex] = 0;
                moved = true;
                messageArea.innerText = `Piece ${pieceIndex+1} entered the board! 🎉`;
            } else if(piecePos !== -1 && piecePos !== 52) {
                const newPos = piecePos + diceValue;
                if(newPos <= 52) {
                    pieces[pieceIndex] = newPos;
                    moved = true;
                    if(newPos === 52) {
                        messageArea.innerText = `🏆 Piece ${pieceIndex+1} reached the goal! 🏆`;
                    } else {
                        messageArea.innerText = `Piece ${pieceIndex+1} moved ${diceValue} steps!`;
                    }
                }
            }
            
            if(moved) {
                waitingForPieceSelection = false;
                lastRollSpan.innerText = diceValue;
                updateUI();
                drawGame();
                
                const allFinished = pieces.every(p => p === 52);
                if(allFinished) {
                    messageArea.innerText += ` 🎉🎊 ${currentPlayer.toUpperCase()} WINS! 🎊🎉`;
                    rollBtn.disabled = true;
                    return;
                }
                
                if(diceValue !== 6) {
                    currentPlayer = (currentPlayer === 'red') ? 'green' : 'red';
                    updateUI();
                    messageArea.innerText += ` Now ${currentPlayer.toUpperCase()}'s turn.`;
                } else {
                    messageArea.innerText += ` You got a 6! Roll again.`;
                    waitingForPieceSelection = true;
                    const newMovable = getMovablePieces();
                    if(newMovable.length === 0) {
                        messageArea.innerText += ` No pieces can move. Turn changes.`;
                        currentPlayer = (currentPlayer === 'red') ? 'green' : 'red';
                        waitingForPieceSelection = false;
                        updateUI();
                    } else {
                        highlightMovablePieces();
                        return;
                    }
                }
                
                const newMovable = getMovablePieces();
                if(newMovable.length === 0 && !waitingForPieceSelection) {
                    messageArea.innerText += ` No moves available. Turn changes.`;
                    currentPlayer = (currentPlayer === 'red') ? 'green' : 'red';
                    updateUI();
                }
                diceValue = 1;
                diceValueDisplay.innerText = '1';
                drawGame();
            } else {
                messageArea.innerText = `Cannot move Piece ${pieceIndex+1}!`;
            }
            removePieceHighlights();
        }
        
        function highlightMovablePieces() {
            const movable = getMovablePieces();
            const buttons = document.querySelectorAll('.piece-btn');
            buttons.forEach((btn, idx) => {
                if(movable.includes(idx)) {
                    btn.disabled = false;
                    btn.classList.add('active-piece');
                } else {
                    btn.disabled = true;
                    btn.classList.remove('active-piece');
                }
            });
            
            if(movable.length === 0) {
                messageArea.innerText = `No pieces can move!`;
                if(diceValue !== 6) {
                    setTimeout(() => {
                        currentPlayer = (currentPlayer === 'red') ? 'green' : 'red';
                        waitingForPieceSelection = false;
                        updateUI();
                        messageArea.innerText = `${currentPlayer.toUpperCase()}'s turn. Roll dice!`;
                        drawGame();
                    }, 1500);
                }
            }
        }
        
        function removePieceHighlights() {
            const buttons = document.querySelectorAll('.piece-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('active-piece');
            });
        }
        
        function rollDice() {
            if(rolling) return;
            if(waitingForPieceSelection) {
                messageArea.innerText = "Please select a piece to move first!";
                return;
            }
            
            rolling = true;
            rollBtn.disabled = true;
            messageArea.innerText = `${currentPlayer.toUpperCase()} is rolling dice...`;
            
            let rolls = 0;
            const interval = setInterval(() => {
                diceValue = Math.floor(Math.random() * 6) + 1;
                diceValueDisplay.innerText = diceValue;
                drawGame();
                rolls++;
                if(rolls > 12) {
                    clearInterval(interval);
                    rolling = false;
                    rollBtn.disabled = false;
                    
                    waitingForPieceSelection = true;
                    const movable = getMovablePieces();
                    
                    if(movable.length === 0) {
                        messageArea.innerText = `${currentPlayer.toUpperCase()} rolled ${diceValue} but no moves! Turn changes.`;
                        setTimeout(() => {
                            currentPlayer = (currentPlayer === 'red') ? 'green' : 'red';
                            waitingForPieceSelection = false;
                            updateUI();
                            messageArea.innerText = `${currentPlayer.toUpperCase()}'s turn. Roll dice!`;
                            drawGame();
                        }, 1500);
                        diceValue = 1;
                        diceValueDisplay.innerText = '1';
                        drawGame();
                    } else {
                        messageArea.innerText = `${currentPlayer.toUpperCase()} rolled ${diceValue}! Select a piece:`;
                        highlightMovablePieces();
                    }
                    updateUI();
                }
            }, 80);
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
        
        rollBtn.onclick = rollDice;
        document.querySelectorAll('.piece-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const pieceIndex = parseInt(btn.getAttribute('data-piece'));
                movePiece(pieceIndex);
            });
            btn.disabled = true;
        });
        
        boardImage.onload = () => { drawGame(); };
        boardImage.onerror = () => { drawGame(); };
        
        updateUI();
        drawGame();
        
        setTimeout(() => {
            const name = userData ? userData.name : 'Player';
            messageArea.innerText = `Welcome ${name}! 🎲 Click ROLL DICE, then select a piece.`;
        }, 1000);
    </script>
</body>
</html>
