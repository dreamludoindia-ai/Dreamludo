<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ludo Kingdom - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(0, 102, 255, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: drift 20s linear infinite;
        }

        @keyframes drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 35px 50px 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 102, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(0, 102, 255, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .game-icon {
            font-size: 65px;
            background: linear-gradient(135deg, #ffffff, #0066ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.5));
        }

        h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, #b0b0b0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            pointer-events: none;
        }

        input {
            width: 100%;
            background: rgba(20, 20, 35, 0.9);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 16px 20px 16px 52px;
            font-size: 16px;
            color: white;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #0066ff;
            background: rgba(25, 25, 45, 0.95);
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.2);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
        }

        .checkbox input {
            width: 18px;
            height: 18px;
            accent-color: #0066ff;
            cursor: pointer;
        }

        .forgot-link {
            color: #0066ff;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .forgot-link:hover {
            opacity: 0.8;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #0066ff, #0044cc);
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 102, 255, 0.5);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            padding: 0 20px;
            position: relative;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .social-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .social-btn {
            background: rgba(20, 20, 35, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 12px 20px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .social-btn:hover {
            background: rgba(0, 102, 255, 0.2);
            border-color: #0066ff;
            transform: translateY(-2px);
        }

        .signup-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
        }

        .signup-link a {
            color: #0066ff;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(255, 50, 50, 0.2);
            border-left: 3px solid #ff3333;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #ff8888;
            font-size: 13px;
            display: none;
        }

        @media (max-width: 500px) {
            .login-card { padding: 30px 25px 40px 25px; }
            h1 { font-size: 28px; }
            .social-btn span { display: none; }
            .social-btn { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="header">
                <div class="game-icon">🎲</div>
                <h1>LUDO KINGDOM</h1>
                <div class="subtitle">Roll the dice & conquer</div>
            </div>

            <div class="error-message" id="errorMsg"></div>

            <form id="loginForm">
                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="Username" autocomplete="off">
                </div>

                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="Password">
                </div>

                <div class="options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberCheck"> 
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">🎮 PLAY NOW →</button>
            </form>

            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <div class="social-buttons">
                <button class="social-btn" onclick="socialLogin('google')">
                    🌐 <span>Google</span>
                </button>
                <button class="social-btn" onclick="socialLogin('guest')">
                    👤 <span>Guest</span>
                </button>
            </div>

            <div class="signup-link">
                New to Ludo? <a href="#" onclick="showSignup()">Create account</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const rememberCheck = document.getElementById('rememberCheck');

        if(localStorage.getItem('savedUsername')) {
            usernameInput.value = localStorage.getItem('savedUsername');
            rememberCheck.checked = true;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if(!username) {
                showError('Please enter your username');
                usernameInput.style.borderColor = '#ff3333';
                setTimeout(() => usernameInput.style.borderColor = '', 2000);
                return;
            }

            if(!password) {
                showError('Please enter your password');
                passwordInput.style.borderColor = '#ff3333';
                setTimeout(() => passwordInput.style.borderColor = '', 2000);
                return;
            }

            if(username.length >= 2 && password.length >= 1) {
                if(rememberCheck.checked) {
                    localStorage.setItem('savedUsername', username);
                } else {
                    localStorage.removeItem('savedUsername');
                }
                
                sessionStorage.setItem('currentUser', username);
                sessionStorage.setItem('playerName', username);
                
                const btn = document.querySelector('.login-btn');
                btn.innerHTML = '✓ WELCOME!';
                btn.style.background = 'linear-gradient(135deg, #00cc66, #009944)';
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } else {
                showError('Username must be at least 2 characters');
            }
        });

        function showError(message) {
            errorMsg.textContent = `⚠️ ${message}`;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 3000);
        }

        function socialLogin(type) {
            if(type === 'google') {
                showError('Google login demo - Enter any username/password above');
            } else if(type === 'guest') {
                sessionStorage.setItem('currentUser', 'Guest');
                sessionStorage.setItem('playerName', 'Guest Player');
                const btn = document.querySelector('.login-btn');
                btn.innerHTML = '✓ WELCOME GUEST!';
                btn.style.background = 'linear-gradient(135deg, #00cc66, #009944)';
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            }
        }

        function showSignup() {
            showError('Sign up demo - Just enter username & password above to play');
        }

        document.querySelectorAll('input, button, a').forEach(el => {
            el.style.outline = 'none';
        });
    </script>
</body>
</html>
