<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DreamLudo - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: float 60s linear infinite;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-200px, -200px); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card with outline */
        .card {
            background: white;
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(102, 126, 234, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
            border-color: rgba(102, 126, 234, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .game-icon {
            font-size: 60px;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            background: #f0f0f0;
            border-radius: 12px;
            padding: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
            text-align: center;
            border-radius: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        /* Forms */
        .form {
            display: none;
        }

        .form.active {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .input-group {
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #aaa;
        }

        .row-2 {
            display: flex;
            gap: 15px;
        }

        .row-2 .input-group {
            flex: 1;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 13px;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
            color: #d32f2f;
            font-size: 13px;
            display: none;
        }

        .success-message {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
            color: #2e7d32;
            font-size: 13px;
            display: none;
        }

        @media (max-width: 500px) {
            .card {
                padding: 35px 25px;
            }
            h1 {
                font-size: 28px;
            }
            .row-2 {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="game-icon">🎲</div>
                <h1>DreamLudo</h1>
                <div class="subtitle">Roll the dice & live the dream</div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('signup')">Create Account</button>
            </div>

            <!-- Messages -->
            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>

            <!-- Login Form -->
            <div id="loginForm" class="form active">
                <div class="input-group">
                    <input type="tel" id="loginMobile" placeholder="Mobile Number" maxlength="10" autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Password">
                </div>
                <button class="submit-btn" onclick="handleLogin()">Login →</button>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="form">
                <div class="input-group">
                    <input type="text" id="signupName" placeholder="Full Name">
                </div>
                <div class="input-group">
                    <input type="tel" id="signupMobile" placeholder="Mobile Number" maxlength="10">
                </div>
                <div class="row-2">
                    <div class="input-group">
                        <input type="date" id="signupDob" placeholder="Date of Birth">
                    </div>
                    <div class="input-group">
                        <input type="text" id="signupCity" placeholder="City">
                    </div>
                </div>
                <div class="input-group">
                    <input type="password" id="signupPassword" placeholder="Password">
                </div>
                <div class="input-group">
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm Password">
                </div>
                <button class="submit-btn" onclick="handleSignup()">Create Account →</button>
            </div>
        </div>
    </div>

    <script>
        // Load users
        let users = JSON.parse(localStorage.getItem('dreamLudoUsers')) || [];

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabs = document.querySelectorAll('.tab-btn');
            
            if(tab === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                loginForm.classList.remove('active');
                signupForm.classList.add('active');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
            hideMessages();
        }

        function hideMessages() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMsg');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 2000);
        }

        function handleSignup() {
            const name = document.getElementById('signupName').value.trim();
            const mobile = document.getElementById('signupMobile').value.trim();
            const dob = document.getElementById('signupDob').value;
            const city = document.getElementById('signupCity').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            if(!name) {
                showError('Please enter your full name');
                return;
            }
            if(name.length < 2) {
                showError('Name must be at least 2 characters');
                return;
            }
            if(!mobile) {
                showError('Please enter mobile number');
                return;
            }
            if(!/^\d{10}$/.test(mobile)) {
                showError('Please enter a valid 10-digit mobile number');
                return;
            }
            if(!dob) {
                showError('Please select date of birth');
                return;
            }
            if(!city) {
                showError('Please enter your city');
                return;
            }
            if(!password) {
                showError('Please enter a password');
                return;
            }
            if(password.length < 4) {
                showError('Password must be at least 4 characters');
                return;
            }
            if(password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            const existingUser = users.find(u => u.mobile === mobile);
            if(existingUser) {
                showError('Mobile number already registered. Please login.');
                return;
            }

            const newUser = {
                name: name,
                mobile: mobile,
                dob: dob,
                city: city,
                password: password,
                createdAt: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem('dreamLudoUsers', JSON.stringify(users));
            
            showSuccess('Account created successfully! Please login.');
            
            document.getElementById('signupName').value = '';
            document.getElementById('signupMobile').value = '';
            document.getElementById('signupDob').value = '';
            document.getElementById('signupCity').value = '';
            document.getElementById('signupPassword').value = '';
            document.getElementById('signupConfirmPassword').value = '';
            
            setTimeout(() => {
                switchTab('login');
            }, 1500);
        }

        function handleLogin() {
            const mobile = document.getElementById('loginMobile').value.trim();
            const password = document.getElementById('loginPassword').value;

            if(!mobile) {
                showError('Please enter mobile number');
                return;
            }
            if(!/^\d{10}$/.test(mobile)) {
                showError('Please enter a valid 10-digit mobile number');
                return;
            }
            if(!password) {
                showError('Please enter password');
                return;
            }

            const user = users.find(u => u.mobile === mobile && u.password === password);
            
            if(user) {
                sessionStorage.setItem('dreamUser', JSON.stringify({
                    name: user.name,
                    mobile: user.mobile,
                    city: user.city
                }));
                sessionStorage.setItem('playerName', user.name);
                
                showSuccess(`Welcome back, ${user.name}!`);
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                const mobileExists = users.find(u => u.mobile === mobile);
                if(mobileExists) {
                    showError('Incorrect password');
                } else {
                    showError('Mobile number not registered. Please create an account.');
                }
            }
        }

        // Add demo account for testing
        if(users.length === 0) {
            users.push({
                name: 'Demo User',
                mobile: '9876543210',
                dob: '1990-01-01',
                city: 'Mumbai',
                password: '1234'
            });
            localStorage.setItem('dreamLudoUsers', JSON.stringify(users));
        }
    </script>
</body>
</html>
