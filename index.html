<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ludo Kingdom - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Card Style - No Border */
        .card {
            background: white;
            padding: 40px 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .game-icon {
            font-size: 55px;
            margin-bottom: 12px;
        }

        h1 {
            color: #1a1a2e;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        /* Tab Buttons */
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            background: #f5f5f5;
            padding: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
            text-align: center;
        }

        .tab-btn.active {
            background: #1a1a2e;
            color: white;
        }

        /* Form Styles */
        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            background: #f8f9fa;
            padding: 14px 18px;
            font-size: 15px;
            color: #1a1a2e;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus {
            background: white;
            box-shadow: 0 0 0 2px rgba(26, 26, 46, 0.1);
        }

        input::placeholder {
            color: #aaa;
        }

        .row-2 {
            display: flex;
            gap: 15px;
        }

        .row-2 .input-group {
            flex: 1;
        }

        .submit-btn {
            width: 100%;
            background: #1a1a2e;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #2a2a4e;
            transform: translateY(-2px);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #eee;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 13px;
        }

        .guest-btn {
            width: 100%;
            background: #f5f5f5;
            padding: 14px;
            font-size: 15px;
            font-weight: 500;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s;
        }

        .guest-btn:hover {
            background: #e5e5e5;
        }

        .error-message {
            background: #fee;
            padding: 12px 15px;
            margin-bottom: 20px;
            color: #d32f2f;
            font-size: 13px;
            display: none;
        }

        .success-message {
            background: #e8f5e9;
            padding: 12px 15px;
            margin-bottom: 20px;
            color: #2e7d32;
            font-size: 13px;
            display: none;
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .toggle-link a {
            color: #1a1a2e;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .card {
                padding: 30px 25px;
            }
            .row-2 {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="game-icon">🎲</div>
                <h1>LUDO KINGDOM</h1>
                <div class="subtitle">Roll the dice & conquer</div>
            </div>

            <!-- Tab Buttons -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('signup')">Create Account</button>
            </div>

            <!-- Error & Success Messages -->
            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>

            <!-- Login Form -->
            <div id="loginForm" class="form active">
                <div class="input-group">
                    <input type="tel" id="loginMobile" placeholder="Mobile Number" maxlength="10">
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Password">
                </div>
                <button class="submit-btn" onclick="handleLogin()">Login →</button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button class="guest-btn" onclick="guestLogin()">Play as Guest</button>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="form">
                <div class="input-group">
                    <input type="text" id="signupName" placeholder="Full Name">
                </div>
                <div class="input-group">
                    <input type="tel" id="signupMobile" placeholder="Mobile Number" maxlength="10">
                </div>
                <div class="input-group">
                    <input type="date" id="signupDob" placeholder="Date of Birth">
                </div>
                <div class="input-group">
                    <input type="text" id="signupCity" placeholder="City">
                </div>
                <div class="input-group">
                    <input type="password" id="signupPassword" placeholder="Password">
                </div>
                <div class="input-group">
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm Password">
                </div>
                <button class="submit-btn" onclick="handleSignup()">Create Account →</button>
            </div>
        </div>
    </div>

    <script>
        // Load saved users from localStorage
        let users = JSON.parse(localStorage.getItem('ludoUsers')) || [];

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabs = document.querySelectorAll('.tab-btn');
            
            if(tab === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                loginForm.classList.remove('active');
                signupForm.classList.add('active');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
            hideMessages();
        }

        function hideMessages() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMsg');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 2000);
        }

        function handleSignup() {
            const name = document.getElementById('signupName').value.trim();
            const mobile = document.getElementById('signupMobile').value.trim();
            const dob = document.getElementById('signupDob').value;
            const city = document.getElementById('signupCity').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            // Validation
            if(!name) {
                showError('Please enter your full name');
                return;
            }
            if(name.length < 2) {
                showError('Name must be at least 2 characters');
                return;
            }
            if(!mobile) {
                showError('Please enter mobile number');
                return;
            }
            if(!/^\d{10}$/.test(mobile)) {
                showError('Please enter a valid 10-digit mobile number');
                return;
            }
            if(!dob) {
                showError('Please select date of birth');
                return;
            }
            if(!city) {
                showError('Please enter your city');
                return;
            }
            if(!password) {
                showError('Please enter a password');
                return;
            }
            if(password.length < 4) {
                showError('Password must be at least 4 characters');
                return;
            }
            if(password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            // Check if mobile already exists
            const existingUser = users.find(u => u.mobile === mobile);
            if(existingUser) {
                showError('Mobile number already registered. Please login.');
                return;
            }

            // Create new user
            const newUser = {
                name: name,
                mobile: mobile,
                dob: dob,
                city: city,
                password: password,
                createdAt: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem('ludoUsers', JSON.stringify(users));
            
            showSuccess('Account created successfully! Please login.');
            
            // Clear signup form
            document.getElementById('signupName').value = '';
            document.getElementById('signupMobile').value = '';
            document.getElementById('signupDob').value = '';
            document.getElementById('signupCity').value = '';
            document.getElementById('signupPassword').value = '';
            document.getElementById('signupConfirmPassword').value = '';
            
            // Switch to login tab
            setTimeout(() => {
                switchTab('login');
            }, 1500);
        }

        function handleLogin() {
            const mobile = document.getElementById('loginMobile').value.trim();
            const password = document.getElementById('loginPassword').value;

            if(!mobile) {
                showError('Please enter mobile number');
                return;
            }
            if(!/^\d{10}$/.test(mobile)) {
                showError('Please enter a valid 10-digit mobile number');
                return;
            }
            if(!password) {
                showError('Please enter password');
                return;
            }

            // Find user
            const user = users.find(u => u.mobile === mobile && u.password === password);
            
            if(user) {
                // Successful login
                sessionStorage.setItem('currentUser', JSON.stringify({
                    name: user.name,
                    mobile: user.mobile,
                    city: user.city
                }));
                sessionStorage.setItem('playerName', user.name);
                
                showSuccess(`Welcome back, ${user.name}!`);
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                // Check if mobile exists but password wrong
                const mobileExists = users.find(u => u.mobile === mobile);
                if(mobileExists) {
                    showError('Incorrect password');
                } else {
                    showError('Mobile number not registered. Please create an account.');
                }
            }
        }

        function guestLogin() {
            sessionStorage.setItem('currentUser', JSON.stringify({
                name: 'Guest Player',
                mobile: 'guest',
                city: 'Guest City'
            }));
            sessionStorage.setItem('playerName', 'Guest Player');
            sessionStorage.setItem('isGuest', 'true');
            
            showSuccess('Playing as Guest!');
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 800);
        }

        // Remove outlines from all elements
        document.querySelectorAll('input, button, select').forEach(el => {
            el.style.outline = 'none';
        });

        // Add demo account hint
        if(users.length === 0) {
            // Add a demo account for testing
            setTimeout(() => {
                console.log('No users found. Create an account to login.');
            }, 100);
        }
    </script>
</body>
</html>
